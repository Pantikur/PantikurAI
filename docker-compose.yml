version: '3.8'

services:
  # === ОСНОВНОЙ CHATBOT API (порт 8000) ===
  chatbot-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: pantikurai/chatbot-api:latest
    container_name: pantikur-chatbot
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - PORT=8000
      - PYTHONUNBUFFERED=1
      - HOST=0.0.0.0
      # Переменные окружения из .env
      - GIGACHAT_TOKEN=${GIGACHAT_TOKEN:-}
      - RETRAIN_TOKEN=${RETRAIN_TOKEN:-}
      # Автообучение из книг
      - AUTO_BOOK_LEARNING=${AUTO_BOOK_LEARNING:-true}
      - AUTO_BOOK_LEARNING_CYCLE=${AUTO_BOOK_LEARNING_CYCLE:-10}
      - AUTO_BOOK_MAX_BOOKS=${AUTO_BOOK_MAX_BOOKS:-5}
      - AUTO_BOOK_TOPICS=${AUTO_BOOK_TOPICS:-2}
      # Rate limiting
      - RATE_LIMIT_REQUESTS=${RATE_LIMIT_REQUESTS:-30}
      # Автопоиск слов
      - AUTO_WEB_SEARCH=${AUTO_WEB_SEARCH:-true}
      - AUTO_WEB_SEARCH_INTERVAL=${AUTO_WEB_SEARCH_INTERVAL:-3600}
      - AUTO_WEB_SEARCH_BATCH_SIZE=${AUTO_WEB_SEARCH_BATCH_SIZE:-10}
      - AUTO_WEB_SEARCH_MIN_LENGTH=${AUTO_WEB_SEARCH_MIN_LENGTH:-2}
      - AUTO_WEB_SEARCH_EXTRACT_DEPTH=${AUTO_WEB_SEARCH_EXTRACT_DEPTH:-1}
      - AUTO_WEB_SEARCH_MAX_NEW_WORDS=${AUTO_WEB_SEARCH_MAX_NEW_WORDS:-10}
      # Отключаем LLM всех девочек в chatbot-api (экономит ~70GB RAM)
      - CELESTA_LLM_ENABLED=0
      - AYIKO_LLM_ENABLED=0
      - HANAKO_LLM_ENABLED=0
      - FUYUKI_LLM_ENABLED=0
      - LUCY_LLM_ENABLED=0
      - FUTABA_LLM_ENABLED=0
      - SHIORI_LLM_ENABLED=0
      - NOBUKA_LLM_ENABLED=0
      - LATISLANE_LLM_ENABLED=0
      - AKVA_LLM_ENABLED=0
      - YU_LLM_ENABLED=0
      - NAOTO_LLM_ENABLED=0
      - SIDNEY_LLM_ENABLED=0
      - KRISTI_LLM_ENABLED=0
    env_file:
      - .env
    restart: unless-stopped
    mem_limit: 24g
    volumes:
      - ./logs:/app/logs
      - ./models:/app/models
      - ./data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/ping || exit 1"]
      interval: 15s
      timeout: 10s
      start_period: 180s
      retries: 10
    stdin_open: true
    tty: true

  # === АВТОНОМНЫЕ ДЕВОЧКИ (24/7) ===
  autonomous-girls:
    build:
      context: .
      dockerfile: Dockerfile
    image: pantikurai/autonomous-girls:latest
    container_name: pantikur-girls
    environment:
      - PYTHONUNBUFFERED=1
      - HF_TOKEN=${HF_TOKEN:-}
      # Отключаем LLM всех девочек (экономим RAM)
      - CELESTA_LLM_ENABLED=0
      - AYIKO_LLM_ENABLED=0
      - HANAKO_LLM_ENABLED=0
      - FUYUKI_LLM_ENABLED=0
      - LUCY_LLM_ENABLED=0
      - FUTABA_LLM_ENABLED=0
      - SHIORI_LLM_ENABLED=0
      - NOBUKA_LLM_ENABLED=0
      - LATISLANE_LLM_ENABLED=0
      - AKVA_LLM_ENABLED=0
      - YU_LLM_ENABLED=0
      - NAOTO_LLM_ENABLED=0
      - SIDNEY_LLM_ENABLED=0
      - KRISTI_LLM_ENABLED=0
    env_file:
      - .env
    restart: unless-stopped
    mem_limit: 15g
    volumes:
      - ./shared_knowledge.json:/app/shared_knowledge.json
      - ./global_progress.json:/app/global_progress.json
      - ./logs:/app/logs
      - ./models:/app/models
      - ./data:/app/data
      - ./futaba:/app/futaba
      - ./shiori:/app/shiori
      - ./nobuka:/app/nobuka
      - ./naoto:/app/naoto
      - ./hanako:/app/hanako
      - ./fuyuki:/app/fuyuki
      - ./lucy:/app/lucy
      - ./latislane:/app/latislane
      - ./celesta:/app/celesta
      - ./akva:/app/akva
      - ./yu:/app/yu
      - ./ayiko:/app/ayiko
      - ./sidney:/app/sidney
    command: python modules/orchestrator_v3.py

  # === АВТООБУЧЕНИЕ МОДЕЛИ (Ханако) ===
  auto-learn:
    build:
      context: .
      dockerfile: Dockerfile
    image: pantikurai/auto-learn:latest
    container_name: pantikur-auto-learn
    environment:
      - PYTHONUNBUFFERED=1
    env_file:
      - .env
    restart: unless-stopped
    mem_limit: 10g
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    command: python auto_learn_cycle.py
