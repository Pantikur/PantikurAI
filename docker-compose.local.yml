version: '3.8'

services:
  pantikur:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pantikur-chatbot
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
      - SELENIUM_REMOTE_URL=
      - CHROME_BIN=/usr/bin/google-chrome
      - AUTO_GIRLS_ENABLED=true
      - AUTO_BOOK_LEARNING=true
      - AUTO_RETRAIN=true
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./models/qwen2.5-3b:/app/models/qwen2.5-3b
      - ./shiori/polygon:/app/shiori/polygon
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 3
    stdin_open: true
    tty: true
