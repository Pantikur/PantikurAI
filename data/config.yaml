# Пути
paths:
  training_pairs: data/training_pairs.jsonl
  knowledge_stats: data/knowledge/knowledge_stats.json

# Ответы по классам
responses:
  positive: "Это прекрасно. Продолжай в том же духе."
  neutral: "Я слушаю. Расскажи больше."
  negative: "Это тяжело. Я рядом."
  disturbing: "Тревожные мысли могут быть глубокими. Хочешь поговорить?"
  existential: "Глубокий вопрос. Давай подумаем вместе."
  hope: "Надежда — сила. Даже в темноте есть свет."
  rage: "Гнев — мощная энергия. Что его вызвало?"
  loneliness: "Чувство одиночества знакомо многим. Ты не один."
  cosmic_horror: "Космическая бездна пугает. Но ты — часть чего-то большего."

# Ключи для извлечения данных
fields:
  text: ["text", "phrase"]
  label: ["class", "sentiment"]

# Настройки
skip_empty_text: true
default_label: neutral

# Профессии (классификация по предмету труда)
professions:
  - filename: professions_human_human.json
    category: "Человек — Человек"
  - filename: professions_human_technics.json
    category: "Человек — Техника"
  - filename: professions_human_nature.json
    category: "Человек — Природа"
  - filename: professions_human_signs.json
    category: "Человек — Знаковые системы"
  - filename: professions_human_arts.json
    category: "Человек — Художественные образы"
  - filename: professions_mixed.json
    category: "Смешанные сферы"