services:
  - type: web
    name: ChatBot API
    plan: free
    runtime: python
    env: production
    buildCommand: pip install -r requirements.txt
    startCommand: sh -c "uvicorn main:app --host 0.0.0.0 --port ${PORT}"
    healthCheckPath: /health
    region: oregon
    envVars:
      - key: API_KEY
        generateValue: true