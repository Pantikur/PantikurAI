# Настройки генерации обучающих данных
generation:
  # Сколько диалогов генерировать за один запуск
  batch_size: 10
  
  # Максимальное количество диалогов в conversations.json
  max_dialogs: 500
  
  # Количество раундов в одном диалоге
  turns_per_dialog: 4
  
  # Задержки между запросами (сек)
  delay_between_requests: 1.0
  
  # Сценарии генерации (темы)
  scenarios:
    - name: "technology"
      description: "Технологии, IT, наука"
      prompts:
        - "Объясни сложную концепцию просто"
        - "Сравни две технологии"
        - "Опиши будущие тенденции"
        - "Разбери практический кейс"
        
    - name: "philosophy"
      description: "Философия, этика, смыслы"
      prompts:
        - "Обсуди дилемму выбора"
        - "Рассуждай о природе сознания"
        - "Анализируй моральный вопрос"
        
    - name: "daily_life"
      description: "Повседневность, эмоции, отношения"
      prompts:
        - "Опиши типичную ситуацию"
        - "Поделиться впечатлением"
        - "Дать совет другу"
        
    - name: "creative"
      description: "Творчество, история, мир"
      prompts:
        - "Придумай сюжет"
        - "Опиши персонажа"
        - "Создай атмосферу места"
        
    - name: "problem_solving"
      description: "Решение проблем, логика"
      prompts:
        - "Разбери задачу"
        - "Найди решение"
        - "Предложи альтернативу"
