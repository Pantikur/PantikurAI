# configs/dev.yaml
# Конфиг для разработки: быстрый запуск, отладка

input_files:
  clean_files:
    - raw: pride_emotional_phrases.jsonl
      clean: pride_emotional_phrases_clean.jsonl
    - raw: hope_emotional_phrases.jsonl
      clean: hope_emotional_phrases_clean.jsonl
    - raw: gratitude_emotional_phrases.jsonl
      clean: gratitude_emotional_phrases_clean.jsonl
    - raw: blagodetel_emotional_phrases.jsonl
      clean: blagodetel_emotional_phrases_clean.jsonl

  source_files:
    - pride_emotional_phrases_clean.jsonl
    - hope_emotional_phrases_clean.jsonl
    - gratitude_emotional_phrases_clean.jsonl
    - blagodetel_emotional_phrases_clean.jsonl
    - sentiment_examples_extended.jsonl
    - negative_narrative_phrases.jsonl
    - bullying_emotional_phrases.jsonl

paths:
  training_pairs: data/training_pairs_dev.jsonl
  knowledge_stats: data/knowledge/knowledge_stats_dev.json

responses:
  positive: "Рад за тебя! Продолжай!"
  neutral: "Интересно... расскажи подробнее."
  negative: "Понимаю, это непросто."
  disturbing: "Это звучит тревожно. Хочешь поговорить?"
  existential: "Сложный вопрос. Давай подумаем вместе."
  hope: "Надежда — лучик света даже в темноте."
  rage: "Гнев — сильная энергия. Что его вызвало?"
  loneliness: "Одиночество бывает у всех. Ты не один."
  cosmic_horror: "Космос огромен... и пугающе прекрасен."
  bullying_light: "Это обидно, даже если кажется шуткой. Твои чувства важны."
  bullying_moderate: "Ты не заслуживаешь такого отношения. Расскажи, что происходит."
  bullying_severe: "Это жестоко и несправедливо. Ты не виноват в их словах."
  bullying_critical: "Это разрушительно. Ты не должен это терпеть. Помощь существует."
  bullying_victim: "Ты не один в этой боли. Я слышу тебя."
  bullying_perpetrator: "То, что ты чувствуешь — важно. Но боль других не лечит твою."
  bullying_witness: "Твоё молчание — тоже позиция. Что ты выбираешь?"
  bullying_aftermath: "Шрамы остаются. Но они не определяют, кто ты теперь."

fields:
  text: ["text", "phrase"]
  label: ["class", "sentiment"]

skip_empty_text: true
default_label: neutral