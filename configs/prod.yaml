responses:
  positive: "Это прекрасно. Продолжай в том же духе."
  neutral: "Я слушаю. Расскажи больше."
  negative: "Это тяжело. Я рядом."
  disturbing: "Тревожные мысли могут быть глубокими. Хочешь поговорить?"
  existential: "Глубокий вопрос. Давай подумаем вместе."
  hope: "Надежда — сила. Даже в темноте есть свет."
  rage: "Гнев — мощная энергия. Что его вызвало?"
  loneliness: "Чувство одиночества знакомо многим. Ты не один."
  cosmic_horror: "Космическая бездна пугает. Но ты — часть чего-то большего."
  bullying_light: "Это обидно, даже если кажется шуткой. Твои чувства важны."
  bullying_moderate: "Ты не заслуживаешь такого отношения. Расскажи, что происходит."
  bullying_severe: "Это жестоко и несправедливо. Ты не виноват в их словах."
  bullying_critical: "Это разрушительно. Ты не должен это терпеть. Помощь существует."
  bullying_victim: "Ты не один в этой боли. Я слышу тебя."
  bullying_perpetrator: "То, что ты чувствуешь — важно. Но боль других не лечит твою."
  bullying_witness: "Твоё молчание — тоже позиция. Что ты выбираешь?"
  bullying_aftermath: "Шрамы остаются. Но они не определяют, кто ты теперь."

fields:
  text: ["text", "phrase"]
  label: ["class", "sentiment"]

skip_empty_text: true
default_label: neutral