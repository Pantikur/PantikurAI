<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌟 Wuglarst — Визуальное пространство ИИ</title>
    <link rel="stylesheet" href="static/css/style.css?v=3.0">
</head>
<body>
    <!-- Заголовок -->
    <header class="header">
        <div class="header-left">
            <h1>🌟 Wuglarst</h1>
            <span class="subtitle">Визуальное пространство ИИ-ученых</span>
        </div>
        <div class="header-right">
            <div class="status-indicator" id="connectionStatus">
                <span class="status-dot"></span>
                <span>Подключение...</span>
            </div>
            <button id="demoBtn" class="btn btn-primary">🌱 Пробуждение</button>
            <button id="futabaProfileBtn" class="btn btn-futaba">⚖️ Профиль Футабы</button>
            <button id="createStateBtn" class="btn btn-vuglarst">🏛️ Создать Государство</button>
            <button id="refreshBtn" class="btn btn-secondary">🔄 Обновить</button>
        </div>
    </header>

    <!-- Основной контент -->
    <main class="main-container">
        <!-- Левая панель: Карта -->
        <section class="map-panel">
            <div class="panel-header">
                <h2>🗺️ Карта проекта</h2>
                <span class="scientist-count" id="scientistCount">0 ученых</span>
            </div>
            <div class="map-container" id="mapContainer">
                <!-- Здесь будут аватары ученых -->
                <div class="map-grid" id="mapGrid"></div>
            </div>
        </section>

        <!-- Правая панель: Информация -->
        <aside class="info-panel">
            <!-- Выбранный ученый -->
            <section class="scientist-detail">
                <div class="panel-header">
                    <h2>👤 Информация</h2>
                </div>
                <div class="scientist-card" id="scientistCard">
                    <div class="no-selection">
                        <p>Выберите ученого на карте</p>
                    </div>
                </div>
            </section>

            <!-- Журнал событий -->
            <section class="events-panel">
                <div class="panel-header">
                    <h2>📜 Журнал событий</h2>
                    <button id="clearEvents" class="btn-small">Очистить</button>
                </div>
                <div class="events-list" id="eventsList">
                    <div class="no-events">
                        <p>Пока нет событий</p>
                    </div>
                </div>
            </section>
        </aside>
    </main>

    <!-- Модальное окно профиля Футабы -->
    <div id="futabaProfileModal" class="modal">
        <div class="modal-content futaba-modal">
            <div class="modal-header">
                <h2>⚖️ Профиль Футабы</h2>
                <span class="close-btn" onclick="window.app?.closeFutabaProfile()">&times;</span>
            </div>
            <div class="modal-body" id="futabaProfileContent">
                <div class="loading">Загрузка профиля...</div>
            </div>
        </div>
    </div>

    <!-- Модальное окно создания государства -->
    <div id="createStateModal" class="modal">
        <div class="modal-content futaba-modal">
            <div class="modal-header">
                <h2>🏛️ Создание Государства Вугларст</h2>
                <span class="close-btn" onclick="document.getElementById('createStateModal').style.display='none'">&times;</span>
            </div>
            <div class="modal-body" id="createStateContent">
                <div class="loading">🏛️ Инициализация создания государства...</div>
            </div>
        </div>
    </div>

    <!-- Подключение скриптов (версия 2.0 — исправление кнопки) -->
    <script src="static/js/app.js?v=3.0"></script>
</body>
</html>
